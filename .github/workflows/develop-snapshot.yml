name: Develop Snapshot Build

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 19
          cache: maven
          server-id: github

      - name: Configure Git
        run: git config user.name "venuchalla" && git config user.email "venuchalla1993@gmail.com"

      - name: Determine Base Version
        id: version
        shell: bash
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -n "$TAG" ]; then
            echo "Git tag found: $TAG"

            BASE_VERSION="${TAG#v}"
          else
            echo "No Git tag found. Reading effective POM version..."
            # Resolves via Maven itself (not grep), so it correctly reads
            # YOUR project's version, not the parent's.
            # -q keeps this a clean, single-line value (required for
            # GITHUB_OUTPUT). If it fails, re-run WITHOUT -q so the real
            # error (e.g. a 401 resolving the parent POM) is visible in
            # the log before we exit.
            if ! BASE_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout); then
              echo "::error::Failed to resolve project.version - re-running verbosely for diagnostics:"
              mvn help:evaluate -Dexpression=project.version -DforceStdout
              exit 1
            fi
          fi

          VERSION="${BASE_VERSION}"

          echo "Base version: $BASE_VERSION"
          echo "Build version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ^ needed here too - resolving project.version means resolving
          # the effective POM, which means resolving the parent POM
          # (springparent) from GitHub Packages. Without this, this step
          # 401s silently and the workflow dies right here.

      - name: Set Maven Version
        run: |
          mvn versions:set \
            -DnewVersion="${{ steps.version.outputs.version }}" \
            -DgenerateBackupPoms=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ^ same reason - versions:set also reads the effective POM
          # (parent included) before it can rewrite the version.

      - name: Build and Deploy
        run: mvn clean deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Version
        run: |
          echo "Deployed ${{ steps.version.outputs.version }}"